[package]
name = "weport"
version = "0.6.9"
description = "Weport — lightweight WeChat chat history exporter (native egui)"
authors = ["Panther114"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
default-run = "weport"
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "weport"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
thiserror = "2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
semver = "1"
open = "5"
libloading = "0.8"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
encoding_rs = "0.8"
aes = "0.8"
cfb-mode = "0.8"
cipher = { version = "0.4", features = ["block-padding"] }
once_cell = "1"
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.31"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader"
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
