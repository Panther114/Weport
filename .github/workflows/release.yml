name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.6.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Build native Weport
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package NSIS installer and updater metadata
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package-release.ps1

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-release
          find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.sig' -o -name '*.json' -o -name '*.nsis.zip' \) -print -exec cp {} dist-release/ \;
          ls -la dist-release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weport-windows
          path: dist-release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Weport ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
