name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.7.0)'
        required: true
        default: 'v0.7.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $refName = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          $tagVersion = $refName.TrimStart('v')
          if ($pkg.version -ne $tagVersion) { throw "Tag $tagVersion does not match package version $($pkg.version)" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis

      - name: Smoke test (capture harness)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/capture-ui.ps1

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Weport-*.exe
            release/Weport-*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: false
