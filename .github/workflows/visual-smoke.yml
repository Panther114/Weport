name: Visual Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build unpacked app
        run: npx electron-builder --dir

      - name: Capture harness (main window + notification popup)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/capture-ui.ps1

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weport-screenshots
          path: |
            ${{ runner.temp }}/weport-electron-screenshots/*.png
          retention-days: 7
